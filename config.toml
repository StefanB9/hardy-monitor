# Hardy's Gym Monitor Configuration
# Copy this file to ~/.config/hardy-monitor/config.toml to customize settings
# All settings shown below are defaults - only include settings you want to change
#
# NOTE: DATABASE_URL is configured via .env file or environment variable, not here.
# This keeps database credentials out of version control.

[database]
# Connection pool limits (DATABASE_URL itself comes from .env / environment).
max_connections = 5
acquire_timeout_secs = 10

[gym]
api_url = "https://portal.aidoo-online.de/workload?mandant=202300180_fuerstenfeldbruck&stud_nr=3&jsonResponse=1"

[network]
request_timeout_secs = 30
connect_timeout_secs = 10

[window]
title = "Hardy's Gym Monitor"
width = 1200.0
height = 850.0
sidebar_width = 250.0

[refresh]
ui_interval_secs = 30
data_fetch_interval_secs = 60
tray_poll_interval_ms = 50

[notifications]
# Low-occupancy alerts are sent by the daemon. Turn them on/off and set the
# threshold from the desktop app or from your phone (see control_topic) —
# that state is stored in the database, not here.
#
# ntfy topic the daemon publishes alerts and command replies to (subscribe to
# it in the ntfy app). Anyone who knows a topic name on ntfy.sh can read it:
# prefer a random name and/or an access token.
ntfy_topic = "hardys-occupancy-1993"
# Override to point at a self-hosted ntfy instance
ntfy_server = "https://ntfy.sh"
# Access token for protected topics: set HARDY__NOTIFICATIONS__NTFY_TOKEN in
# the environment, never here.
#
# Topic the daemon reads commands from (must differ from ntfy_topic). Send:
#   on            arm until closing at the current threshold
#   on 25 2h      arm below 25% for 2 hours (1-12h), or "always"/"closing"
#   off           disarm
#   status        reply with the current state
# control_topic = "pick-a-random-name"
# Minimum seconds between consecutive alerts
cooldown_secs = 300
# No alerts this long after opening (it is always empty at opening time)
opening_grace_minutes = 60
# Optional gym-local times in which alerts may fire; empty = any opening hour.
# days: "daily", "weekdays" or "weekends" (holidays count as weekends)
# windows = [
#     { days = "weekdays", start = "16:00", end = "21:00" },
#     { days = "weekends", start = "10:00", end = "18:00" },
# ]

[thresholds]
low_occupancy_percent = 30.0
high_occupancy_percent = 60.0

[analytics]
prediction_window_days = 28

[schedule]
# IANA timezone of the gym. Opening hours, holidays and all local-time
# statistics use this zone, so results are identical on every host
# (desktop, Docker/UTC server, ...).
timezone = "Europe/Berlin"

[schedule.weekday]
open_hour = 6
close_hour = 23

[schedule.weekend]
open_hour = 9
close_hour = 21
