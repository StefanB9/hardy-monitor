cargo-features = ["panic-immediate-abort"]

[package]
name = "hardy-monitor"
version = "0.1.0"
edition = "2024"

[features]
default = ["gui"]
gui = ["dep:iced", "dep:image", "dep:muda", "dep:notify-rust", "dep:tray-icon"]

[dependencies]
anyhow = { version = "1.0.101", default-features = false }
chrono = { version = "0.4.43", default-features = false, features = ["serde"] }
clap = { version = "4.5.59", default-features = false, features = ["derive", "std"] }
config = { version = "0.15.19", default-features = false }
csv = { version = "1.4.0", default-features = false }
dirs = { version = "6.0.0", default-features = false }
dotenvy = { version = "0.15.7", default-features = false }
futures = { version = "0.3.32", default-features = false }
iced = { version = "0.14.0", default-features = false, features = ["advanced", "canvas", "crisp", "tokio", "wgpu"], optional = true }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"], optional = true }
muda = { version = "0.17.1", default-features = false, optional = true }
notify-rust = { version = "4.12.0", default-features = false, optional = true }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "blocking"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
sqlx = { version = "0.9.0-alpha.1", default-features = false, features = ["chrono", "macros", "migrate","postgres", "runtime-tokio", "tls-rustls"] }
thiserror = { version = "2.0.18", default-features = false }
tokio = { version = "1.49.0", default-features = false, features = ["macros", "rt-multi-thread"] }
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["env-filter", "fmt", "std"] }
tray-icon = { version = "0.21.3", default-features = false, optional = true }

[dev-dependencies]
proptest = "1.10.0"
temp-env = "0.3.6"
tempfile = "3.25.0"
wiremock = "0.6.5"

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
panic = "immediate-abort"
rpath = false
strip = true

[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
panic = "unwind"
rpath = true
strip = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"

print_stdout = "warn"
print_stderr = "warn"

pedantic = { level = "warn", priority = -1 }
# Disabling specific pedantic lints that are often considered too noisy:
must_use_candidate = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
