cargo-features = ["panic-immediate-abort"]

[workspace]
members = [
    "crates/hardy-core",
    "crates/hardy-daemon",
    "crates/hardy-forecaster",
    "crates/hardy-gui",
    "crates/hardy-ml",
]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
print_stdout = "warn"
print_stderr = "warn"
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
# --- Shared across multiple crates ---
anofox-forecast = { version = "=0.16.2", default-features = false }
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
argmin = { version = "0.11.0", default-features = false }
argmin-math = { version = "0.5.1", default-features = false, features = ["vec"] }
burn = { version = "=0.22.0", default-features = false, features = ["std", "autodiff", "optim", "flex", "store"] }
chrono-tz = { version = "0.10.4", default-features = false, features = ["serde"] }

# --- GUI-only ---
approx = { version = "0.6.0-rc2", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }

# --- Core-only ---
config = { version = "0.15.27", default-features = false, features = ["toml"] }
csv = { version = "1.4.0", default-features = false }
dirs = { version = "7.0.0", default-features = false }
dotenvy = { version = "0.15.7", default-features = false }
faer = { version = "0.24.4", default-features = false, features = ["linalg", "std"] }
forust-ml = { version = "=0.8.0", default-features = false }
futures = { version = "0.3.34", default-features = false }
iced = { version = "0.14.0", default-features = false, features = ["advanced", "canvas", "crisp", "tokio", "wgpu"] }
indicatif = { version = "0.18.6", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
mimalloc = { version = "0.1.52", default-features = false }
muda = { version = "0.21.2", default-features = false }
notify-rust = { version = "4.18.2", default-features = false }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }

# --- Dev dependencies ---
proptest = { version = "1.12.0" }
rayon = { version = "1.12.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "rc"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
smartcore = { version = "0.6.16", default-features = false, features = ["serde"] }
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls"] }
stlrs = { version = "0.4.0", default-features = false, features = ["alloc"] }
temp-env = { version = "0.3.6" }
tempfile = { version = "3.27.0" }
thiserror = { version = "2.0.21", default-features = false }
tokio = { version = "1.53.3", default-features = false, features = ["macros", "rt-multi-thread"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
tracing = { version = "0.1.44", default-features = false, features = ["attributes", "std"] }
tracing-appender = { version = "0.2.5", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }
tray-icon = { version = "0.26.1", default-features = false }
wiremock = { version = "0.6.5" }
zstd = { version = "0.14.2", default-features = false }

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
panic = "immediate-abort"
rpath = false
strip = true

[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
panic = "unwind"
rpath = true
strip = false

# Random forest training is ~20x slower unoptimised. smartcore's generic
# code is instantiated in hardy-ml, so both need optimising to keep tests fast.
[profile.dev.package.smartcore]
opt-level = 3

[profile.dev.package.hardy-ml]
opt-level = 3

# Neural network training is ~50x slower unoptimised; the tensor kernels
# live in burn's crates and gemm (matrix products) rather than in hardy-ml.
[profile.dev.package.burn-flex]
opt-level = 3

[profile.dev.package.burn-autodiff]
opt-level = 3

[profile.dev.package.burn-backend]
opt-level = 3

[profile.dev.package.burn-dispatch]
opt-level = 3

[profile.dev.package.burn-tensor]
opt-level = 3

[profile.dev.package.burn-nn]
opt-level = 3

[profile.dev.package.burn-optim]
opt-level = 3

[profile.dev.package.burn-core]
opt-level = 3

[profile.dev.package.burn-std]
opt-level = 3

[profile.dev.package.gemm]
opt-level = 3

[profile.dev.package.gemm-common]
opt-level = 3

[profile.dev.package.gemm-f32]
opt-level = 3

[profile.dev.package.gemm-f64]
opt-level = 3

[profile.dev.package.pulp]
opt-level = 3
